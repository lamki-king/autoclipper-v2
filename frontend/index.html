<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClipper V2</title><style>body{margin:0;background:#09090b;color:#fff;font:14px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 16px}.card{background:#151519;border:1px solid #29292f;border-radius:18px;padding:22px;margin-top:18px}.drop{display:block;border:2px dashed #4b4b55;border-radius:15px;padding:42px 18px;text-align:center;cursor:pointer}.drop input{display:none}.drop b{display:block;font-size:17px;margin:8px 0}.muted{color:#9999a5}.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#7957e8;color:#fff;font-weight:800}.btn:disabled{opacity:.5}.bar{height:8px;background:#292930;border-radius:8px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:#9a7cff}.status{margin-top:12px;min-height:22px}.bad{color:#ff7188}.good{color:#49d99a}.hidden{display:none}.clip{border-top:1px solid #29292f;padding:16px 0}.clip video{width:100%;border-radius:12px}h1{font-size:34px;margin:0 0 8px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#292930;color:#cfcfd8;font-size:12px;margin-top:8px}</style></head><body><div class="wrap"><h1>AutoClipper V2</h1><div class="muted">Production AI short-form video engine.</div><section class="card"><label class="drop" for="video"><input id="video" type="file" accept="video/*,.mp4,.mov,.m4v,.webm"><b id="name">Tap to choose a video</b><span class="muted">Resumable cloud upload · up to 500 MB</span></label><div id="info" class="muted"></div><button id="go" class="btn" type="button">Upload & Generate Clips</button><div class="bar"><div id="fill" class="fill"></div></div><div id="status" class="status muted"></div></section><section id="results" class="card hidden"><h2>Generated Clips</h2><div id="clips"></div></section></div><script>const $=x=>document.getElementById(x);let file=null,job=null;const MAX=500*1024*1024;function status(t,c='muted'){$('status').textContent=t;$('status').className='status '+c}function pct(n){$('fill').style.width=Math.max(0,Math.min(100,n))+'%'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':'&#39;')}async function json(url,opt){const r=await fetch(url,Object.assign({cache:'no-store'},opt||{}));let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||d.error||'HTTP '+r.status);return d}$('video').onchange=()=>{file=$('video').files[0]||null;if(file){$('name').textContent=file.name;$('info').textContent=(file.size/1048576).toFixed(1)+' MB · '+(file.type||'video');status('Ready.')}};function uploadPart(uploadId,key,n,blob,totalBytes,baseBytes){return new Promise((resolve,reject)=>{let attempt=0;const run=()=>{attempt++;const x=new XMLHttpRequest();x.open('PUT','/upload/part/'+encodeURIComponent(uploadId)+'/'+n+'?key='+encodeURIComponent(key),true);x.timeout=180000;x.upload.onprogress=e=>{if(e.lengthComputable)pct(5+((baseBytes+e.loaded)/totalBytes)*70)};x.onload=()=>{let d={};try{d=JSON.parse(x.responseText||'{}')}catch{}if(x.status>=200&&x.status<300&&d.ETag){resolve(d)}else if(attempt<5){status('Retrying part '+n+' ('+attempt+'/4)…');setTimeout(run,Math.min(8000,700*2**(attempt-1)))}else reject(Error(d.detail||'Part '+n+' upload failed (HTTP '+x.status+').'))};x.onerror=()=>{if(attempt<5){status('Connection retry for part '+n+'…');setTimeout(run,Math.min(8000,700*2**(attempt-1)))}else reject(Error('Connection failed uploading part '+n+'.'))};x.ontimeout=()=>{if(attempt<5){status('Timeout retry for part '+n+'…');setTimeout(run,Math.min(8000,700*2**(attempt-1)))}else reject(Error('Upload timed out on part '+n+'.'))};const fd=new FormData();fd.append('chunk',blob,'part-'+n);x.send(fd)};run()})}async function uploadToCloud(){const init=await json('/upload/init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,size:file.size,content_type:file.type||'video/mp4'})});const size=Number(init.part_size),total=Number(init.total_parts);const parts=new Array(total);let next=1,doneBytes=0;async function worker(){while(true){const n=next++;if(n>total)return;const start=(n-1)*size,end=Math.min(file.size,start+size),blob=file.slice(start,end);status('Uploading part '+n+'/'+total+'…');const result=await uploadPart(init.upload_id,init.key,n,blob,file.size,doneBytes);parts[n-1]={PartNumber:n,ETag:result.ETag};doneBytes+=blob.size;pct(5+(doneBytes/file.size)*70)}}await Promise.all([worker(),worker()]);return {upload_id:init.upload_id,key:init.key,parts}}async function poll(id){for(let i=0;i<450;i++){await new Promise(r=>setTimeout(r,2000));const d=await json('/status/'+encodeURIComponent(id));status(String(d.status||'processing').replace(/_/g,' ')+'…');if(d.status==='failed')throw Error(d.error||'Processing failed');if(d.status==='done'){render(d);pct(100);status('Finished '+(d.clips||[]).length+' clip(s).','good');return}}throw Error('Processing timed out')}function render(d){$('results').classList.remove('hidden');$('clips').innerHTML=(d.clips||[]).map(c=>{const u=c.download_url||('/download/'+encodeURIComponent(job)+'/'+c.index);return '<article class="clip"><video controls playsinline preload="metadata" src="'+esc(u)+'"></video><h3>'+esc(c.title||'Clip')+'</h3><p class="muted">'+esc(c.reason||c.hook||'')+'</p><span class="pill">Score '+esc(c.score||0)+'</span><br><a href="'+esc(u)+'" download>Download MP4</a></article>'}).join('')||'<p class="muted">No clips generated.</p>'}async function start(){if(!file)return status('Choose a video first.','bad');if(file.size>MAX)return status('Video exceeds the 500 MB limit.','bad');$('go').disabled=true;$('results').classList.add('hidden');pct(1);let upload=null;try{const h=await json('/health');if(!h.openai_configured)throw Error('OpenAI is not configured on the server.');if(h.storage!=='r2')throw Error('Persistent storage is not configured on the server.');status('Creating secure cloud upload…');upload=await uploadToCloud();status('All parts uploaded. Finalizing…');const d=await json('/upload/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:upload.key,upload_id:upload.upload_id,parts:upload.parts,filename:file.name,size:file.size,max_clips:5,instruction:''})});job=d.job_id;if(!job)throw Error('Upload completed but no job ID was returned.');pct(80);status('Upload complete. Starting AI processing…');await poll(job)}catch(e){status(e.message||'Upload failed.','bad')}finally{$('go').disabled=false}}$('go').onclick=start;</script></body></html>
