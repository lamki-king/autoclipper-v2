<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClipper V3</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#09090b;color:#f4f4f5}main{max-width:1050px;margin:auto;padding:32px 18px}.brand{font-size:32px;font-weight:900}.sub{color:#a1a1aa;margin:6px 0 28px}.card{background:#18181b;border:1px solid #27272a;border-radius:18px;padding:22px;margin-bottom:18px}.drop{display:block;border:1.5px dashed #52525b;border-radius:14px;padding:30px;text-align:center;cursor:pointer;color:#d4d4d8;margin-top:8px}.drop input{display:none}.row{display:grid;grid-template-columns:1fr 180px;gap:14px}input,textarea{width:100%;background:#09090b;color:#fff;border:1px solid #3f3f46;border-radius:10px;padding:12px;font:inherit}textarea{min-height:90px;resize:vertical}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:20px;background:#fff;color:#09090b;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.45}.status{margin-top:16px;color:#a1a1aa;min-height:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.clip{border:1px solid #27272a;border-radius:14px;padding:16px}.score{font-size:28px;font-weight:900}.bar{height:7px;background:#27272a;border-radius:9px;overflow:hidden;margin:8px 0 12px}.fill{height:100%;background:#fff}.tag{display:inline-block;border:1px solid #3f3f46;border-radius:999px;padding:4px 8px;margin:3px;font-size:12px;color:#d4d4d8}.download{display:block;margin-top:12px;color:#fff;font-weight:700}.social{margin-top:18px;border-top:1px solid #27272a;padding-top:18px}.err{color:#f87171}.ok{color:#86efac}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body><main><div class="brand">AutoClipper V3</div><div class="sub">AI-powered viral clipping engine — score, edit and package your best moments.</div><section class="card"><label>Long-form video</label><label class="drop"><input id="video" type="file" accept="video/*"><span id="videoName">Choose a video</span></label><label style="display:block;margin-top:16px">Watermark (optional)</label><label class="drop"><input id="watermark" type="file" accept="image/png,image/jpeg"><span id="wmName">Choose a logo</span></label><label style="display:block;margin-top:16px">Tell the AI what you want</label><textarea id="instruction" placeholder="Example: Find the funniest moments, controversial takes, or the best money-making advice."></textarea><div class="row"><div><label style="display:block;margin-top:14px">Maximum clips</label><input id="count" type="number" min="1" max="10" value="5"></div><div></div></div><button class="btn" id="go">🚀 Generate Viral Clips</button><div id="status" class="status"></div></section><section class="card" id="results" hidden><h2>🔥 Ranked Clips</h2><div id="clips" class="grid"></div><div id="social" class="social"></div></section></main><script>
const video=document.getElementById('video'),wm=document.getElementById('watermark'),status=document.getElementById('status'),go=document.getElementById('go'),results=document.getElementById('results'),clips=document.getElementById('clips'),social=document.getElementById('social');
video.onchange=()=>document.getElementById('videoName').textContent=video.files[0]?.name||'Choose a video';wm.onchange=()=>document.getElementById('wmName').textContent=wm.files[0]?.name||'Choose a logo';const msg=(t,c='')=>{status.textContent=t;status.className='status '+c};const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
go.onclick=async()=>{if(!video.files[0])return msg('Choose a video first.','err');go.disabled=true;results.hidden=true;clips.innerHTML='';social.innerHTML='';msg('Uploading video…');try{const fd=new FormData();fd.append('file',video.files[0]);if(wm.files[0])fd.append('watermark',wm.files[0]);fd.append('max_clips',document.getElementById('count').value);fd.append('instruction',document.getElementById('instruction').value);let r=await fetch('/process',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.detail||'Processing failed');msg('AI is transcribing and analyzing your video…');for(;;){await new Promise(x=>setTimeout(x,2200));r=await fetch('/status/'+d.job_id);d=await r.json();if(d.status==='failed')throw Error(d.error||'Processing failed');if(d.status==='done')break;msg('Status: '+d.status.replaceAll('_',' ')+'…')}msg('Finished — ranked by viral potential.','ok');results.hidden=false;(d.clips||[]).forEach(c=>{const el=document.createElement('div');el.className='clip';el.innerHTML=`<div class="score">${esc(c.score)}/99</div><div class="bar"><div class="fill" style="width:${Math.min(99,c.score)}%"></div></div><strong>${esc(c.title)}</strong><p>${esc(c.reason)}</p><span class="tag">${esc(c.category)}</span><span class="tag">Hook ${esc(c.scores.hook||0)}</span><span class="tag">Value ${esc(c.scores.value||0)}</span><span class="tag">Emotion ${esc(c.scores.emotion||0)}</span><a class="download" href="${esc(c.download_url)}" target="_blank">Download clip →</a>`;clips.appendChild(el)});const s=d.social||{};if(Object.keys(s).length){social.innerHTML='<h2>📱 Social package</h2>'+Object.entries(s).map(([k,v])=>`<div><strong>${esc(k.replace('_',' '))}</strong><p><b>${esc(v.title||'')}</b><br>${esc(v.caption||'')}</p><small>${(v.hashtags||[]).map(esc).join(' ')}</small></div>`).join('')} }catch(e){msg(e.message,'err')}finally{go.disabled=false}};
</script></body></html>
