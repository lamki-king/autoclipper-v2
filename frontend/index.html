<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClipper V2</title><style>body{margin:0;background:#09090b;color:#fff;font:14px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 16px}.card{background:#151519;border:1px solid #29292f;border-radius:18px;padding:22px;margin-top:18px}.drop{display:block;border:2px dashed #4b4b55;border-radius:15px;padding:42px 18px;text-align:center;cursor:pointer}.drop input{display:none}.drop b{display:block;font-size:17px;margin:8px 0}.muted{color:#9999a5}.field{margin-top:15px}.field label{display:block;margin-bottom:7px;color:#bbb}.input,.area{width:100%;padding:12px;border-radius:10px;border:1px solid #33343b;background:#0c0c10;color:#fff;box-sizing:border-box}.area{min-height:90px}.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#7957e8;color:#fff;font-weight:800}.btn:disabled{opacity:.5}.bar{height:8px;background:#292930;border-radius:8px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#9a7cff}.status{margin-top:12px;min-height:22px}.bad{color:#ff7188}.good{color:#49d99a}.clip{border-top:1px solid #29292f;padding:16px 0}.clip video{width:100%;max-height:520px;background:#000;border-radius:12px}.download{display:inline-block;margin-top:10px;padding:10px 13px;background:#25252d;color:#fff;border-radius:9px;text-decoration:none;font-weight:700}.hidden{display:none}h1{font-size:34px;margin:0 0 8px}h2{margin:0}.pill{display:inline-block;border:1px solid #33343b;border-radius:99px;padding:5px 9px;color:#aaa;margin:3px;font-size:11px}</style></head><body><div class="wrap"><h1>AutoClipper V2</h1><div class="muted">AI-powered short-form video clipping.</div><section class="card"><label class="drop" for="video"><input id="video" type="file" accept="video/*,.mp4,.mov,.m4v,.webm"><span style="font-size:30px">↑</span><b id="fileName">Tap to choose a video</b><span class="muted">MP4, MOV, WebM · up to 500 MB</span></label><div id="fileInfo" class="muted"></div><div class="field"><label>What should the AI find?</label><textarea id="instruction" class="area" placeholder="funny moments, valuable advice, controversial takes..."></textarea></div><div class="field"><label>Maximum clips</label><input id="count" class="input" type="number" min="1" max="10" value="5"></div><button id="go" class="btn" type="button">Upload & Generate Clips</button><div class="bar"><div id="fill" class="fill"></div></div><div id="status" class="status muted"></div></section><section id="results" class="card hidden"><h2>Generated Clips</h2><div id="clips"></div></section></div><script>const $=id=>document.getElementById(id);let file=null,job=null;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function msg(t,c='muted'){$('status').textContent=t;$('status').className='status '+c}function pct(n){$('fill').style.width=Math.max(0,Math.min(100,n))+'%'}function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':'&#39;'})}$('video').addEventListener('change',function(){file=this.files&&this.files[0]||null;if(file){$('fileName').textContent=file.name;$('fileInfo').textContent=(file.size/1048576).toFixed(1)+' MB selected';msg('Ready to upload.')}});async function jsonFetch(url,opt){const r=await fetch(url,Object.assign({cache:'no-store'},opt||{}));let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.detail||d.error||('Server error HTTP '+r.status));return d}async function uploadChunks(){const init=await jsonFetch('/upload/init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,size:file.size})});const id=init.upload_id,chunk=Number(init.chunk_size)||8388608,total=Math.ceil(file.size/chunk);for(let i=0;i<total;i++){const part=file.slice(i*chunk,Math.min(file.size,(i+1)*chunk));await jsonFetch('/upload/chunk/'+encodeURIComponent(id)+'/'+i,{method:'PUT',body:part});pct(5+(i+1)/total*70);msg('Uploading '+(i+1)+'/'+total+'…')}return jsonFetch('/upload/complete/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chunks:total,max_clips:Math.max(1,Math.min(10,Number($('count').value)||5)),instruction:$('instruction').value.trim()})})}async function poll(id){for(let i=0;i<300;i++){await sleep(2000);const d=await jsonFetch('/status/'+encodeURIComponent(id));const p=Number(d.progress);pct(78+(Number.isFinite(p)?Math.min(22,p*.22):0));msg(String(d.status||'processing').replace(/_/g,' ')+'…');if(d.status==='failed')throw new Error(d.error||'Processing failed');if(d.status==='done'){render(d);pct(100);msg('Finished '+(d.clips?d.clips.length:0)+' clip(s).','good');return}}throw new Error('Processing timed out.')}function render(d){$('results').classList.remove('hidden');const list=Array.isArray(d.clips)?d.clips:[];$('clips').innerHTML=list.map(function(c){const u=c.download_url||('/download/'+encodeURIComponent(job)+'/'+c.index);return '<article class="clip"><video controls playsinline preload="metadata" src="'+esc(u)+'"></video><div><b>'+esc(c.title||'Clip')+'</b><span class="pill">'+esc(c.category||'clip')+'</span><span class="pill">Score '+esc(c.score||0)+'/99</span><p class="muted">'+esc(c.reason||c.hook||'')+'</p><a class="download" href="'+esc(u)+'" download>Download MP4</a></div></article>'}).join('')||'<p class="muted">No clips were generated.</p>'}async function start(){if(!file)return msg('Choose a video first.','bad');if(file.size>500*1024*1024)return msg('This video is over the 500 MB server limit.','bad');$('go').disabled=true;$('results').classList.add('hidden');pct(1);try{const h=await jsonFetch('/health');if(!h.openai_configured)throw new Error('OPENAI_API_KEY is not configured in Render.');msg('Starting secure chunked upload…');const d=await uploadChunks();job=d.job_id;if(!job)throw new Error('Upload completed but no job ID was returned.');pct(78);msg('Upload complete. AI processing started.');await poll(job)}catch(e){msg(e.message||'Upload failed.','bad')}finally{$('go').disabled=false}}$('go').addEventListener('click',start);</script></body></html>
