<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoClipper V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#09090b;color:#f4f4f5;min-height:100vh}main{max-width:900px;margin:auto;padding:32px 18px}.brand{font-size:28px;font-weight:800;margin-bottom:6px}.sub{color:#a1a1aa;margin-bottom:28px}.card{background:#18181b;border:1px solid #27272a;border-radius:18px;padding:22px;margin-bottom:18px}label{display:block;font-weight:650;margin:14px 0 8px}.drop{display:block;border:1.5px dashed #52525b;border-radius:14px;padding:30px;text-align:center;cursor:pointer;color:#d4d4d8}.drop:hover{border-color:#a1a1aa}.drop input{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}input[type=number]{width:100%;background:#09090b;color:#fff;border:1px solid #3f3f46;border-radius:10px;padding:12px}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:20px;background:#fff;color:#09090b;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:16px;color:#a1a1aa;min-height:24px}.clip{padding:14px 0;border-top:1px solid #27272a}.clip:first-child{border-top:0}.download{display:inline-block;margin-top:8px;color:#fff}.err{color:#f87171}.ok{color:#86efac}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<div class="brand">AutoClipper V2</div><div class="sub">Turn long videos into ready-to-post short clips.</div>
<section class="card"><label>Video</label><label class="drop"><input id="video" type="file" accept="video/*"><span id="videoName">Tap to choose a video</span></label>
<label>Watermark (optional)</label><label class="drop"><input id="watermark" type="file" accept="image/png,image/jpeg"><span id="wmName">Tap to choose an image</span></label>
<div class="row"><div><label for="count">Maximum clips</label><input id="count" type="number" min="1" max="10" value="5"></div></div>
<button class="btn" id="go">Generate Clips</button><div id="status" class="status"></div></section>
<section class="card" id="results" hidden><h2>Generated clips</h2><div id="clips"></div></section>
</main>
<script>
const video=document.getElementById('video'),wm=document.getElementById('watermark'),status=document.getElementById('status'),go=document.getElementById('go'),results=document.getElementById('results'),clips=document.getElementById('clips');
video.onchange=()=>document.getElementById('videoName').textContent=video.files[0]?.name||'Tap to choose a video';
wm.onchange=()=>document.getElementById('wmName').textContent=wm.files[0]?.name||'Tap to choose an image';
const msg=(t,c='')=>{status.textContent=t;status.className='status '+c};
go.onclick=async()=>{if(!video.files[0])return msg('Choose a video first.','err');go.disabled=true;results.hidden=true;clips.innerHTML='';msg('Uploading video…');
try{const fd=new FormData();fd.append('file',video.files[0]);if(wm.files[0])fd.append('watermark',wm.files[0]);fd.append('max_clips',document.getElementById('count').value);let r=await fetch('/process',{method:'POST',body:fd});let d=await r.json();if(!r.ok)throw Error(d.detail||'Processing request failed');msg('Job started. Analyzing your video…');let job=d.job_id;
for(;;){await new Promise(x=>setTimeout(x,2500));r=await fetch('/status/'+job);d=await r.json();if(d.status==='failed')throw Error(d.error||'Processing failed');if(d.status==='done')break;msg('Status: '+d.status.replaceAll('_',' ')+'…');}
msg('Finished! Your clips are ready.','ok');results.hidden=false;(d.clips||[]).forEach(c=>{const el=document.createElement('div');el.className='clip';el.innerHTML='<strong>'+escapeHtml(c.title)+'</strong><div>'+escapeHtml(c.reason||'')+'</div><a class="download" href="'+c.download_url+'" target="_blank">Download clip</a>';clips.appendChild(el)});
}catch(e){msg(e.message,'err')}finally{go.disabled=false}};
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
