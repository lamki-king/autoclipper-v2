<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClipper V2</title><style>body{margin:0;background:#09090b;color:#fff;font:14px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 16px}.card{background:#151519;border:1px solid #29292f;border-radius:18px;padding:22px;margin-top:18px}.drop{display:block;border:2px dashed #4b4b55;border-radius:15px;padding:42px 18px;text-align:center;cursor:pointer}.drop input{display:none}.drop b{display:block;font-size:17px;margin:8px 0}.muted{color:#9999a5}.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:#7957e8;color:#fff;font-weight:800}.btn:disabled{opacity:.5}.bar{height:8px;background:#292930;border-radius:8px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:#9a7cff}.status{margin-top:12px;min-height:22px}.bad{color:#ff7188}.good{color:#49d99a}.hidden{display:none}.clip{border-top:1px solid #29292f;padding:16px 0}.clip video{width:100%;border-radius:12px}h1{font-size:34px;margin:0 0 8px}</style></head><body><div class="wrap"><h1>AutoClipper V2</h1><div class="muted">AI-powered short-form video clipping.</div><section class="card"><label class="drop" for="video"><input id="video" type="file" accept="video/*,.mp4,.mov,.m4v,.webm"><b id="name">Tap to choose a video</b><span class="muted">MP4, MOV, WebM · up to 500 MB</span></label><div id="info" class="muted"></div><button id="go" class="btn" type="button">Upload & Generate Clips</button><div class="bar"><div id="fill" class="fill"></div></div><div id="status" class="status muted"></div></section><section id="results" class="card hidden"><h2>Generated Clips</h2><div id="clips"></div></section></div><script>const $=x=>document.getElementById(x);let file=null,job=null;function status(t,c='muted'){$('status').textContent=t;$('status').className='status '+c}function pct(n){$('fill').style.width=Math.max(0,Math.min(100,n))+'%'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':'&#39;')}async function json(url,opt){const r=await fetch(url,Object.assign({cache:'no-store'},opt||{}));let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||d.error||'Server error HTTP '+r.status);return d}$('video').onchange=()=>{file=$('video').files[0]||null;if(file){$('name').textContent=file.name;$('info').textContent=(file.size/1048576).toFixed(1)+' MB selected';status('Ready to upload.')}};function sendChunk(url,blob,index,total){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('PUT',url,true);x.timeout=0;x.upload.onprogress=e=>{if(e.lengthComputable){const base=5+(index/total)*70;const within=(e.loaded/e.total)*(70/total);pct(base+within);status('Uploading '+(index+1)+'/'+total+'…')}};x.onload=()=>{let d={};try{d=JSON.parse(x.responseText||'{}')}catch{}if(x.status>=200&&x.status<300)resolve(d);else reject(Error(d.detail||'Chunk rejected (HTTP '+x.status+')'))};x.onerror=()=>reject(Error('Connection failed while uploading chunk '+(index+1)+'.'));x.ontimeout=()=>reject(Error('Upload timed out on chunk '+(index+1)+'.'));const fd=new FormData();fd.append('chunk',blob,'chunk-'+index);x.send(fd)})}async function uploadChunks(){const init=await json('/upload/init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,size:file.size})});const id=init.upload_id,chunkSize=Number(init.chunk_size)||8388608,total=Math.ceil(file.size/chunkSize);for(let i=0;i<total;i++){const blob=file.slice(i*chunkSize,Math.min(file.size,(i+1)*chunkSize));await sendChunk('/upload/chunk/'+encodeURIComponent(id)+'/'+i,blob,i,total)}status('All chunks uploaded. Finalizing…');return json('/upload/complete/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chunks:total,max_clips:5,instruction:''})})}async function poll(id){for(let i=0;i<300;i++){await new Promise(r=>setTimeout(r,2000));const d=await json('/status/'+encodeURIComponent(id));status(String(d.status||'processing').replace(/_/g,' ')+'…');if(d.status==='failed')throw Error(d.error||'Processing failed');if(d.status==='done'){render(d);pct(100);status('Finished '+(d.clips||[]).length+' clip(s).','good');return}}throw Error('Processing timed out.')}function render(d){$('results').classList.remove('hidden');$('clips').innerHTML=(d.clips||[]).map(c=>{const u=c.download_url||('/download/'+encodeURIComponent(job)+'/'+c.index);return '<article class="clip"><video controls playsinline preload="metadata" src="'+esc(u)+'"></video><h3>'+esc(c.title||'Clip')+'</h3><p class="muted">'+esc(c.reason||c.hook||'')+'</p><a href="'+esc(u)+'" download>Download MP4</a></article>'}).join('')||'<p class="muted">No clips generated.</p>'}async function start(){if(!file)return status('Choose a video first.','bad');if(file.size>500*1024*1024)return status('Video exceeds the 500 MB limit.','bad');$('go').disabled=true;$('results').classList.add('hidden');pct(1);try{const h=await json('/health');if(!h.openai_configured)throw Error('OPENAI_API_KEY is not configured in Render.');const d=await uploadChunks();job=d.job_id;if(!job)throw Error('Upload completed but no job ID was returned.');pct(80);status('Upload complete. Starting AI processing…');await poll(job)}catch(e){status(e.message||'Upload failed.','bad')}finally{$('go').disabled=false}}$('go').onclick=start;</script></body></html>
